name: "GridBlast alpha playtest feedback"
description: "Report a bug, controls issue, accessibility barrier or playtest impression"
title: "[Alpha feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing GridBlast. This is a public GitHub issue. Do **not** post emails, passwords, serial numbers, private logs or other personal information.
  - type: dropdown
    id: kind
    attributes:
      label: Feedback category
      options:
        - Crash, freeze or lost progress
        - Touch / drag / tap controls
        - Gameplay, hints or difficulty
        - Accessibility or screen layout
        - Audio, vibration or animation
        - Installation or device compatibility
        - General playtest impression
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: "Example: Pixel 6a, Android 15. Do not share device IDs."
      placeholder: "Phone model, Android version"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build tested
      description: "Git commit SHA, Actions run URL, or approximate download date."
      placeholder: "Example: main commit 4a9ea2f"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you try and what happened?
      description: "For a bug, give reproduction steps, expected result and actual result."
      placeholder: |
        1. I selected...
        2. I dragged...
        Expected:
        Actual:
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What felt good or frustrating?
      description: "Optional thoughts on difficulty, polish, replay value or accessibility."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: "I have removed personal/private information from the report and any attachments."
          required: true
