name: Bootstrap official Gradle wrapper (temporary)

on:
  push:
    branches:
      - chore/checked-in-gradle-wrapper

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate wrapper from pinned official Gradle
        run: gradle wrapper --gradle-version 9.6.0 --distribution-type bin
      - name: Verify wrapper jar is official Gradle 9.6.0
        run: |
          test "$(git hash-object gradle/wrapper/gradle-wrapper.jar)" = "b1b8ef56b44f16b14dc800fa8103a6d89abb526f"
      - name: Pin official distribution SHA256
        run: |
          checksum="$(curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256 | tr -d '\r\n')"
          [[ "$checksum" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '\ndistributionSha256Sum=%s\n' "$checksum" >> gradle/wrapper/gradle-wrapper.properties
      - name: Commit standard wrapper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chmod +x gradlew
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "build: check in verified Gradle 9.6 wrapper"
            git push origin HEAD:chore/checked-in-gradle-wrapper
          fi
