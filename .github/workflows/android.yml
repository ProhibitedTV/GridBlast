name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Provide API 37 legacy SDK path
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Validate official Gradle 9.8.2 wrapper
        run: |
          sh scripts/verify-gradle-wrapper.sh
          ./gradlew --version
      - name: Check POSIX emulator test script syntax
        run: sh -n scripts/android-emulator-tests.sh
      - name: Test failure-classification safeguards
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Verify manifest security and local-data protection
        run: python3 scripts/verify-android-manifest.py
      - name: Validate original Play listing artwork
        run: python3 scripts/verify-store-assets.py
      - name: Test and build debug APK, unsigned release APK and bundle
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify debug and release APK targets, permissions and native libraries
        run: |
          bash scripts/verify-apk-security.sh debug app/build/outputs/apk/debug/app-debug.apk
          bash scripts/verify-apk-security.sh release app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GridBlast-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
