name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Provide API 37 legacy SDK path
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check packaged APK has no network or advertising permissions
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk")
          printf '%s\n' "$permissions"
          if printf '%s\n' "$permissions" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)|com.google.android.gms.permission.AD_ID'; then
            echo "Unexpected network or advertising permission!" >&2
            exit 1
          fi
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GridBlast-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
