name: Android emulator smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: API ${{ matrix.api-level }} ${{ matrix.form-factor }} UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk=26: catch startup and compatibility regressions on our
          # oldest officially supported Android version, not just API 29+.
          - api-level: 26
            form-factor: standard
          - api-level: 29
            form-factor: standard
          - api-level: 35
            form-factor: standard
          - api-level: 35
            form-factor: compact-320dp
          - api-level: 35
            form-factor: large-font-360dp
          - api-level: 36
            form-factor: standard
          - api-level: 36
            form-factor: tablet-600dp
          # Short screen + large system text stresses vertical layout.
          - api-level: 35
            form-factor: short-large-font-360dp
          # No radio connectivity, Android dark mode, real game controls.
          - api-level: 35
            form-factor: offline-dark-360dp
          # Android's three-button navigation changes available viewport insets.
          - api-level: 35
            form-factor: three-button-360dp
          # Animations enabled (most other CI profiles deliberately suppress them).
          - api-level: 35
            form-factor: motion-enabled-360dp
          # Real Android package-manager update between two differently-versioned
          # APKs signed with the SAME disposable CI debug key. No owner secrets.
          - api-level: 35
            form-factor: upgrade-in-place-360dp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install project compile SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: SDK compatibility path
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Capture host resource and SDK preflight
        run: |
          mkdir -p app/build/emulator-diagnostics
          {
            echo '--- Host, disk, memory and KVM ---'
            uname -a
            df -h .
            free -h
            ls -l /dev/kvm || true
            echo '--- Android SDK packages before emulator boot ---'
            sdkmanager --list_installed | grep -E 'platform-tools|build-tools;36.0.0|platforms;android-37.0|system-images' || true
            echo '--- Android platform tools ---'
            adb version
          } | tee app/build/emulator-diagnostics/host-preflight.txt
      - name: Run UI tests on Android emulator
        id: android-emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: ${{ matrix.form-factor != 'motion-enabled-360dp' }}
          script: sh scripts/android-emulator-tests.sh ${{ matrix.form-factor }}
      # These steps always run after an emulator action failure. They report
      # evidence but NEVER turn a failed UI assertion into a green check.
      - name: Capture final emulator and adb status
        if: always()
        run: |
          mkdir -p app/build/emulator-diagnostics
          {
            echo '--- adb device enumeration ---'
            timeout 15s adb devices -l || true
            echo '--- Android boot state (if a device is available) ---'
            timeout 15s adb shell getprop sys.boot_completed || true
            echo '--- Package service (if a device is available) ---'
            timeout 15s adb shell cmd package list packages android || true
            echo '--- Remaining disk space ---'
            df -h .
          } > app/build/emulator-diagnostics/post-run.txt 2>&1
      - name: Classify failure for triage only
        if: always()
        env:
          EMULATOR_ACTION_OUTCOME: ${{ steps.android-emulator.outcome }}
          EMULATOR_API_LEVEL: ${{ matrix.api-level }}
          EMULATOR_PROFILE: ${{ matrix.form-factor }}
        run: |
          python3 scripts/report_emulator_ci.py \
            --outcome "$EMULATOR_ACTION_OUTCOME" \
            --api "$EMULATOR_API_LEVEL" \
            --profile "$EMULATOR_PROFILE" \
            --diagnostics-dir app/build/emulator-diagnostics
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GridBlast-emulator-report-api${{ matrix.api-level }}-${{ matrix.form-factor }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/emulator-screenshots/
            app/build/emulator-diagnostics/
          if-no-files-found: warn
