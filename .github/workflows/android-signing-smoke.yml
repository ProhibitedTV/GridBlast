name: Android disposable-key release signing smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No production credentials and no artifact upload. A PR can execute this
# because its signing identity is generated from scratch on every CI runner.
permissions:
  contents: read

jobs:
  signing-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Provide API 37 compatibility path
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify trusted Gradle wrapper and Android manifest
        run: |
          sh scripts/verify-gradle-wrapper.sh
          python3 scripts/verify-android-manifest.py
      - name: Exercise signed APK/AAB with disposable CI key, then destroy it
        run: bash scripts/smoke-test-release-signing.sh
